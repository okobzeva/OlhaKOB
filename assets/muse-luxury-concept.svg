<text x="753" y="522" class="sans" fill="#fffaf3" font-size="9" letter-spacing="2">LOOK 01 / THE CITY EDIT</text>
<text x="735" y="581" class="serif ink" font-size="22">Made from your closet</text>
<text x="735" y="604" class="sans muted" font-size="12">3 pieces · 1 considered look</text>
