<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">MUSE — Luxury Fashion Stylist Concept</title>
<desc id="desc">An editorial design concept for MUSE, a minimal luxury wardrobe and personal styling app, shown on a warm ivory canvas with a fashion portrait, outfit cards and a digital wardrobe phone interface.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ec"/><stop offset="1" stop-color="#e9e1d5"/></linearGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9cbb8"/><stop offset="1" stop-color="#9d8a74"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f0e7d9"/><stop offset="1" stop-color="#c8b8a4"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#43382f" flood-opacity=".13"/></filter>
 <clipPath id="photo"><rect x="88" y="235" width="530" height="660" rx="2"/></clipPath>
 <style>
 .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.ink{fill:#282621}.muted{fill:#82796e}.line{stroke:#d3c9bc;stroke-width:1}
 </style>
</defs>
<rect width="1600" height="1100" fill="url(#paper)"/>
<!-- header -->
<text x="88" y="76" class="sans ink" font-size="15" letter-spacing="5">MUSE / PERSONAL STYLE SYSTEM</text>
<text x="1510" y="76" text-anchor="end" class="sans muted" font-size="12" letter-spacing="2">CONCEPT 01 — AUTUMN / WINTER</text>
<line x1="88" y1="103" x2="1512" y2="103" class="line"/>
<text x="88" y="190" class="serif ink" font-size="76" letter-spacing="-3">Wear what</text>
<text x="88" y="267" class="serif ink" font-size="76" font-style="italic" letter-spacing="-3">already moves you.</text>
<text x="92" y="310" class="sans muted" font-size="15" letter-spacing="1.3">A quieter, more considered way to get dressed.</text>
