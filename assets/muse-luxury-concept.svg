<g class="sans muted" font-size="10">
 <text x="735" y="740">SOFT KNIT</text><text x="840" y="740">TAILORED</text><text x="945" y="740">LEATHER</text>
</g>
<rect x="735" y="765" width="302" height="49" rx="1" fill="#282621"/>
<text x="886" y="795" text-anchor="middle" class="sans" fill="#fffaf3" font-size="11" letter-spacing="2">GENERATE MY OUTFITS  ↗</text>
<text x="735" y="853" class="sans muted" font-size="10" letter-spacing="1">WARDROBE FIRST</text>
<text x="735" y="876" class="serif ink" font-size="16">Shop your own style.</text>
<line x1="735" y1="901" x2="1037" y2="901" class="line"/>
<text x="735" y="922" class="sans muted" font-size="9" letter-spacing="2">HOME     CLOSET     SAVED     PLAN</text>
<!-- right-side brand story -->
<text x="1135" y="196" class="sans muted" font-size="11" letter-spacing="3">THE MUSE PRINCIPLE</text>
<text x="1135" y="250" class="serif ink" font-size="34">Personal style,</text>
<text x="1135" y="289" class="serif ink" font-size="34" font-style="italic">without the noise.</text>
<line x1="1135" y1="318" x2="1512" y2="318" class="line"/>
<text x="1135" y="362" class="sans ink" font-size="12" letter-spacing="2">01 / EDIT</text>
<text x="1135" y="390" class="serif ink" font-size="23">Know what you own.</text>
<text x="1135" y="416" class="sans muted" font-size="13">A thoughtful digital wardrobe</text>
<text x="1135" y="436" class="sans muted" font-size="13">built around your real clothes.</text>
<line x1="1135" y1="465" x2="1512" y2="465" class="line"/>
<text x="1135" y="509" class="sans ink" font-size="12" letter-spacing="2">02 / STYLE</text>
<text x="1135" y="537" class="serif ink" font-size="23">Dress for your day.</text>
<text x="1135" y="563" class="sans muted" font-size="13">Weather, mood, occasion —</text>
<text x="1135" y="583" class="sans muted" font-size="13">one simple, considered edit.</text>
<line x1="1135" y1="612" x2="1512" y2="612" class="line"/>
<text x="1135" y="656" class="sans ink" font-size="12" letter-spacing="2">03 / REPEAT</text>
<text x="1135" y="684" class="serif ink" font-size="23">Buy less. Wear more.</text>
<text x="1135" y="710" class="sans muted" font-size="13">Make new combinations before</text>
<text x="1135" y="730" class="sans muted" font-size="13">adding anything to your cart.</text>
<rect x="1135" y="790" width="377" height="116" fill="#e1d7ca"/>
<text x="1160" y="825" class="sans muted" font-size="10" letter-spacing="2">DESIGN LANGUAGE</text>
<text x="1160" y="855" class="serif ink" font-size="21">Ivory · espresso · soft taupe</text>
<text x="1160" y="880" class="sans muted" font-size="12">Editorial typography / quiet luxury / clarity</text>
<!-- footer -->
<line x1="88" y1="1010" x2="1512" y2="1010" class="line"/>
<text x="88" y="1047" class="sans muted" font-size="11" letter-spacing="2">MUSE — A DIGITAL WARDROBE FOR REAL LIFE</text>
<text x="1512" y="1047" text-anchor="end" class="serif ink" font-size="18" font-style="italic">Style, made personal.</text>
</svg>