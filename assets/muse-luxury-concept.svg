</g>
<text x="735" y="208" class="serif ink" font-size="29" letter-spacing="1">MUSE</text>
<text x="1037" y="205" text-anchor="end" class="sans muted" font-size="10" letter-spacing="2">YOUR WARDROBE</text>
<line x1="735" y1="230" x2="1037" y2="230" class="line"/>
<text x="735" y="267" class="sans muted" font-size="10" letter-spacing="2">MONDAY, 14 OCTOBER</text>
<text x="735" y="306" class="serif ink" font-size="30">Good morning.</text>
<text x="735" y="332" class="sans muted" font-size="13">Let's make getting dressed simple.</text>
<rect x="735" y="354" width="302" height="194" rx="3" fill="#e7ddd0"/>
