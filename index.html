<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSE — Create a Style</title>
<style>
:root{--line:#ffffff66;--glass:#ffffff22;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 47% 48%,#73e6dc 0%,#48c5d7 27%,transparent 62%),linear-gradient(115deg,#0754cb 0%,#319de0 38%,#2bc5b6 72%,#17a77f 100%)}
button,select{font:inherit}button{color:white;cursor:pointer}
.app{max-width:1600px;margin:auto;padding:24px clamp(14px,3vw,44px)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.logo{font:46px Georgia,serif;letter-spacing:.2em}.logo small{display:block;font:10px Arial,sans-serif;letter-spacing:.35em;margin-top:4px}
.topnote{padding:13px 18px;border:1px solid var(--line);border-radius:40px;background:var(--glass);font-size:12px}
.layout{display:grid;grid-template-columns:100px minmax(280px,1fr) minmax(340px,440px);gap:22px;align-items:stretch}
.categories{display:flex;flex-direction:column;justify-content:center;gap:10px}
.category{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid transparent;border-radius:18px;background:transparent;padding:8px 2px;font-size:11px}
.category .icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff30;border:1px solid #ffffff55;font-size:22px}
.category.active .icon,.category:hover .icon{box-shadow:0 0 0 3px white,0 0 22px #fff;background:#ffffff55}
.stage{position:relative;min-height:730px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage:before{content:"";position:absolute;inset:4% 0 5%;background:radial-gradient(ellipse at 50% 54%,#ffffff2b,transparent 62%);pointer-events:none}
.plumbob{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);width:36px;height:60px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:linear-gradient(90deg,#3bc82f,#d9ff69 48%,#49d832 51%,#087c46);filter:drop-shadow(0 0 12px #9aff75)}
.character-wrap{position:absolute;inset:75px 0 94px;display:flex;align-items:flex-end;justify-content:center}
#sims-character{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 18px #17475b35);transition:opacity .15s}
#sims-character.loading{opacity:.2}
.ground{position:absolute;bottom:83px;width:42%;height:25px;left:50%;transform:translateX(-50%);border-radius:50%;background:#174c5540;filter:blur(15px);pointer-events:none}
.stage-caption{position:absolute;bottom:49px;left:0;right:0;text-align:center;font:22px Georgia,serif}
.stage-caption small{display:block;margin-top:5px;font:10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.zoom-controls{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.zoom-controls button{width:27px;height:27px;border:1px solid #ffffff99;border-radius:50%;background:#ffffff20}
.panels{display:flex;flex-direction:column;gap:15px;min-width:0;padding-top:6px}
.panel{padding:20px;border:1px solid var(--line);border-radius:23px;background:var(--glass);backdrop-filter:blur(12px)}
h1,h2{font-weight:500;margin:0 0 16px}h1{font-size:23px}h2{font-size:19px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin:0 0 8px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{font-size:11px;min-width:0}label span{display:block;margin-bottom:9px}
select{width:100%;min-width:0;padding:11px 5px;border:1px solid var(--line);border-radius:12px;color:white;background:#087e9b55;font-size:11px}select option{color:#173b49}
.outfit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.outfit{min-width:0;padding:5px;border:1px solid #ffffff55;border-radius:14px;background:#ffffff18;transition:.2s}
.outfit:hover{transform:translateY(-3px)}.outfit[aria-pressed=true]{border:2px solid white;box-shadow:0 0 15px #fff9}
.outfit img{display:block;width:100%;height:150px;object-fit:cover;object-position:center top;border-radius:9px;background:#ffffff20}
.outfit span{display:block;font-size:10px;line-height:1.3;padding:8px 1px 5px}
.generate{width:90%;align-self:center;padding:15px;border:1px solid white;border-radius:40px;background:#078fa577;font-weight:600}
.generate:hover{background:#08738caa}.status{text-align:center;min-height:18px;font-size:12px;margin:0;opacity:.9}
@media(min-width:1400px){.layout{grid-template-columns:110px minmax(340px,1fr) minmax(380px,470px)}.outfit img{height:175px}}
@media(max-width:950px){.layout{grid-template-columns:85px minmax(250px,1fr)}.panels{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.panels .greeting,.panels .generate,.panels .status{grid-column:1/-1}.stage{min-height:650px}}
@media(max-width:560px){.app{padding:13px}.logo{font-size:34px}.topnote{font-size:10px;padding:10px}.layout{display:flex;flex-direction:column}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.category .icon{width:40px;height:40px}.stage{min-height:560px}.character-wrap{inset:75px 0 100px}.panels{display:flex}.fields{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:15px}.outfit img{height:135px}.outfit span{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">MUSE<small>AI FASHION STYLIST</small></div><div class="topnote">✧ Create your next look</div></header>
<div class="layout">
<nav class="categories" aria-label="Clothing categories">
<button class="category active" data-category="Everyday"><span class="icon">♧</span>Everyday</button>
<button class="category" data-category="Tops"><span class="icon">♧</span>Tops</button>
<button class="category" data-category="Trousers"><span class="icon">♙</span>Trousers</button>
<button class="category" data-category="Skirts"><span class="icon">♜</span>Skirts</button>
<button class="category" data-category="Dresses"><span class="icon">♟</span>Dresses</button>
<button class="category" data-category="Outerwear"><span class="icon">♧</span>Outerwear</button>
<button class="category" data-category="Shoes"><span class="icon">⌁</span>Shoes</button>
<button class="category" data-category="Accessories"><span class="icon">◇</span>Accessories</button>
</nav>
<section class="stage" aria-label="Full-body character preview">
<div class="plumbob" aria-hidden="true"></div>
<div class="character-wrap">
<img id="sims-character" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1100&q=90" alt="Full-body character wearing casual outfit">
</div>
<div class="ground"></div>
<div class="stage-caption">Your Muse<small id="outfit-title">Casual Outfit</small></div>
<div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button></div>
</section>
<aside class="panels">
<section class="panel greeting"><p class="eyebrow">Personal styling studio</p><h1>Choose your vibe</h1><div class="fields">
<label><span>▦ Event</span><select id="event"><option>Everyday</option><option>Work</option><option>Date Night</option><option>Party</option><option>Wedding</option><option>Travel</option></select></label>
<label><span>☀ Weather</span><select id="weather"><option>Sunny</option><option>Cloudy</option><option>Rainy</option><option>Cold</option><option>Hot</option></select></label>
<label><span>☻ Mood</span><select id="mood"><option>Confident</option><option>Relaxed</option><option>Romantic</option><option>Playful</option><option>Bold</option></select></label>
</div></section>
<section class="panel"><h2>Outfit preview</h2><div class="outfit-grid">
<button class="outfit" data-outfit="casual" aria-pressed="true"><img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=400&q=85" alt="Casual outfit preview"><span>Casual Outfit</span></button>
<button class="outfit" data-outfit="cozy" aria-pressed="false"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=400&q=85" alt="Cozy knitwear preview"><span>Cozy Knitwear</span></button>
<button class="outfit" data-outfit="streetwear" aria-pressed="false"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=400&q=85" alt="Streetwear preview"><span>Streetwear Style</span></button>
<button class="outfit" data-outfit="formal" aria-pressed="false"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=400&q=85" alt="Formal outfit preview"><span>Formal Event</span></button>
</div></section>
<button class="generate" id="generate">✦ Generate Outfit Suggestion →</button>
<p class="status" id="status" aria-live="polite"></p>
</aside>
</div>
</div>
<script>
/*
 * Replace these four URLs with hosted, matching Sims-style character renders
 * to keep the exact same face and hair in every outfit. Current URLs are
 * fashion photography examples, not genuine Sims 4 renders.
 */
const outfits={
 casual:{image:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1100&q=90",title:"Casual Outfit"},
 cozy:{image:"https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1100&q=90",title:"Cozy Knitwear"},
 streetwear:{image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1100&q=90",title:"Streetwear Style"},
 formal:{image:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1100&q=90",title:"Formal Event"}
};
const character=document.getElementById("sims-character");
const title=document.getElementById("outfit-title");
const status=document.getElementById("status");
let selectedOutfit="casual", zoom=1;

/* The central image src is changed immediately on every outfit click. */
function changeOutfit(imageUrl,outfitTitle,outfitKey){
 character.src=imageUrl;
 character.alt="Full-body character wearing "+outfitTitle;
 title.textContent=outfitTitle;
 selectedOutfit=outfitKey;
 document.querySelectorAll(".outfit").forEach(button=>{
  button.setAttribute("aria-pressed",String(button.dataset.outfit===outfitKey));
 });
 character.classList.add("loading");
 character.onload=()=>character.classList.remove("loading");
 character.onerror=()=>{character.classList.remove("loading");status.textContent="Image could not load. Check this image URL.";};
 status.textContent=outfitTitle+" selected.";
}
document.querySelectorAll(".outfit").forEach(button=>button.addEventListener("click",()=>{
 const look=outfits[button.dataset.outfit];
 if(look)changeOutfit(look.image,look.title,button.dataset.outfit);
}));
document.querySelectorAll(".category").forEach(button=>button.addEventListener("click",()=>{
 document.querySelectorAll(".category").forEach(item=>item.classList.remove("active"));
 button.classList.add("active");
 status.textContent=button.dataset.category+" category selected.";
}));
document.getElementById("generate").addEventListener("click",()=>{
 const event=document.getElementById("event").value;
 const weather=document.getElementById("weather").value;
 const mood=document.getElementById("mood").value;
 let key="casual";
 if(["Wedding","Party","Date Night"].includes(event))key="formal";
 else if(["Cold","Rainy"].includes(weather))key="cozy";
 else if(["Bold","Playful"].includes(mood))key="streetwear";
 const look=outfits[key];
 changeOutfit(look.image,look.title,key);
 status.textContent=look.title+" suggested for "+event+", "+weather.toLowerCase()+" weather, and a "+mood.toLowerCase()+" mood.";
});
document.getElementById("zoom-in").addEventListener("click",()=>{zoom=Math.min(1.2,zoom+.05);character.style.transform="scale("+zoom+")";});
document.getElementById("zoom-out").addEventListener("click",()=>{zoom=Math.max(.8,zoom-.05);character.style.transform="scale("+zoom+")";});
</script>
</body>
</html>
